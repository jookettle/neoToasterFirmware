name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, master, chore/pin-lib-deps]
  pull_request:
    branches: [main, master, chore/pin-lib-deps]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run clang-format
        uses: DoozyX/clang-format-lint-action@v0.16
        with:
          source: '.'
          extensions: 'cpp,h,hpp,c'
          clangFormatVersion: 16
          style: file
          exclude: './.git ./.pio'
          inplace: 'true'

      - name: Commit formatted code
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git commit -m "chore: apply clang-format (CI)"
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${BRANCH}"

  build:
    name: Build Firmware
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [esp32dev, adafruit_matrixportal_esp32s3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.platformio/.cache
            .pio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Show PlatformIO version
        run: pio --version

      - name: Build Environment
        run: pio run -e ${{ matrix.env }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/
